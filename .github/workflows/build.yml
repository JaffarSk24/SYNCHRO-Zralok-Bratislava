name: Build check

# Runs on pull requests only. Pushes to main go straight to "Deploy to Hetzner",
# which builds both locales itself — running this on every push would just
# duplicate that work and burn Actions minutes.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build SK
        run: npm run build

      - name: Build EN
        run: PUBLIC_LOCALE=en npx astro build --outDir dist-en

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

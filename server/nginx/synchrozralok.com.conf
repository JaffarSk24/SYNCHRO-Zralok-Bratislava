# nginx vhost — synchrozralok.com (English build)
# Reference / source-of-truth. Applied manually on the server (CI never touches nginx).
# See server/nginx/README.md for how to apply.

server {
    server_name synchrozralok.com www.synchrozralok.com;
    if ($host = www.synchrozralok.com) { return 301 https://synchrozralok.com$request_uri; }
    root /var/www/synchrozralok-en;   # English static build (dist-en)
    index index.html;
    charset utf-8;                    # serve .txt/.html/.xml as UTF-8 (avoids mojibake)

    # Keep ACME challenge open for Let's Encrypt
    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /var/www/synchrozralok-en;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|webp|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Form API (php-fpm); files live outside the static deploy root
    location ~ ^/api/(config|prihlaska)\.php$ {
        root /var/www/synchrozralok-api;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # missing .xml/.txt (e.g. old sitemap-index) -> real 404, not the HTML fallback
    location ~ \.(xml|txt)$ { try_files $uri =404; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/synchrozralok.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/synchrozralok.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.synchrozralok.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = synchrozralok.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name synchrozralok.com www.synchrozralok.com;
    return 404; # managed by Certbot
}

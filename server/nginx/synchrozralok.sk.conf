# nginx vhost — synchrozralok.sk (Slovak build)
# Reference / source-of-truth. Applied manually on the server (CI never touches nginx).
# See server/nginx/README.md for how to apply.
#
# NOTE: the SK build is deployed to /var/www/synchrozralok.com (legacy dir name —
# it holds the Slovak site, not the .com one). The EN build is /var/www/synchrozralok-en.

server {
    server_name synchrozralok.sk www.synchrozralok.sk;

    # canonical: www -> non-www (over https)
    if ($host = www.synchrozralok.sk) { return 301 https://synchrozralok.sk$request_uri; }

    root /var/www/synchrozralok.com;  # Slovak static build (dist) — legacy dir name
    index index.html;
    charset utf-8;                    # serve .txt/.html/.xml as UTF-8 (avoids mojibake)

    location ^~ /.well-known/acme-challenge/ {
        allow all; root /var/www/synchrozralok.com;
    }

    # Form API (php-fpm) — works on .sk too
    location ~ ^/api/(config|prihlaska)\.php$ {
        root /var/www/synchrozralok-api;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|webp|svg|woff|woff2|ttf|eot)$ {
        expires 1y; add_header Cache-Control "public, no-transform"; access_log off;
    }
    # missing .xml/.txt (e.g. old sitemap-index) -> real 404, not the HTML fallback
    location ~ \.(xml|txt)$ { try_files $uri =404; }

    location / { try_files $uri $uri/ /index.html; }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/synchrozralok.sk/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/synchrozralok.sk/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.synchrozralok.sk) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = synchrozralok.sk) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name synchrozralok.sk www.synchrozralok.sk;
    return 404; # managed by Certbot
}
